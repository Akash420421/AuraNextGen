<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aura AI 3D Particle Orb</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #canvas-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  canvas {
    width: 100%;
    height: 100%;
    display: block;
    background: transparent;
  }
</style>
</head>
<body>
<div id="canvas-container">
  <canvas id="particles"></canvas>
</div>

<script>
(() => {
  const container = document.getElementById('canvas-container');
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');

  let w = 0, h = 0;
  let dots = [];
  let angleX = 0, angleY = 0;
  let frame = 0;
  let currentMode = 'idle'; // 'idle', 'listening', 'thinking', 'speaking'
  
  // Morph state: 0 = Sphere (locked to spherical particle orb geometry)
  let morphProgress = 0;
  let targetMorph = 0;
  let autoMorph = false;
  let morphHoldTimer = 0;

  // Regular Tetrahedron 4 Vertices (inscribed in sphere)
  const T_VERTICES = [
    { x: 0, y: 1.15, z: 0 },                                           // Top Apex
    { x: Math.sqrt(8/9) * 1.15, y: -0.38 * 1.15, z: 0 },              // Base 1
    { x: -Math.sqrt(2/9) * 1.15, y: -0.38 * 1.15, z: Math.sqrt(2/3) * 1.15 },  // Base 2
    { x: -Math.sqrt(2/9) * 1.15, y: -0.38 * 1.15, z: -Math.sqrt(2/3) * 1.15 } // Base 3
  ];

  // 4 Faces
  const T_FACES = [
    [0, 1, 2],
    [0, 2, 3],
    [0, 3, 1],
    [1, 3, 2]
  ];

  // 6 Edges
  const T_EDGES = [
    [0, 1], [0, 2], [0, 3],
    [1, 2], [2, 3], [3, 1]
  ];

  function getTetrahedronPoint(idx, total) {
    // 35% on edges for crisp sharp wireframe contour, 65% on surface faces
    if ((idx % 3) === 0) {
      const edge = T_EDGES[idx % T_EDGES.length];
      const vA = T_VERTICES[edge[0]];
      const vB = T_VERTICES[edge[1]];
      const t = Math.random();
      const jitter = (Math.random() - 0.5) * 0.04;
      return {
        x: vA.x + (vB.x - vA.x) * t + jitter,
        y: vA.y + (vB.y - vA.y) * t + jitter,
        z: vA.z + (vB.z - vA.z) * t + jitter
      };
    } else {
      const face = T_FACES[idx % T_FACES.length];
      const vA = T_VERTICES[face[0]];
      const vB = T_VERTICES[face[1]];
      const vC = T_VERTICES[face[2]];
      let r1 = Math.random();
      let r2 = Math.random();
      if (r1 + r2 > 1) {
        r1 = 1 - r1;
        r2 = 1 - r2;
      }
      const jitter = (Math.random() - 0.5) * 0.06;
      return {
        x: vA.x + r1 * (vB.x - vA.x) + r2 * (vC.x - vA.x) + jitter,
        y: vA.y + r1 * (vB.y - vA.y) + r2 * (vC.y - vA.y) + jitter,
        z: vA.z + r1 * (vB.z - vA.z) + r2 * (vC.z - vA.z) + jitter
      };
    }
  }

  function resize() {
    const r = container.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    w = r.width;
    h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const count = Math.max(650, Math.min(1400, Math.round(Math.min(w, h) * 4.2)));
    dots = [];

    for (let i = 0; i < count; i++) {
      // 1. Sphere position (Fibonacci spiral on sphere)
      const sy = 1 - 2 * (i + 0.5) / count;
      const radius = Math.sqrt(Math.max(0, 1 - sy * sy));
      const theta = i * 2.3999632297; // Golden angle
      const sx = Math.cos(theta) * radius;
      const sz = Math.sin(theta) * radius;

      // 2. 3D Triangle (Tetrahedron) position
      const tPoint = getTetrahedronPoint(i, count);

      dots.push({
        sx: sx, sy: sy, sz: sz,
        tx: tPoint.x, ty: tPoint.y, tz: tPoint.z,
        size: 0.55 + Math.random() * 1.1,
        tint: Math.random(),
        speedOffset: 0.8 + Math.random() * 0.4
      });
    }
  }

  // Smooth easing function
  function easeInOutCubic(x) {
    return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    frame++;

    // Rotation speeds according to mode
    let speedY = 0.007;
    let speedX = 0.002;
    if (currentMode === 'thinking') {
      speedY = 0.022;
      speedX = 0.006;
    } else if (currentMode === 'speaking') {
      speedY = 0.015;
      speedX = 0.004;
    } else if (currentMode === 'listening') {
      speedY = 0.010;
      speedX = 0.003;
    }

    angleY += speedY;
    angleX += speedX;

    // Auto morphing oscillation (Sphere <-> 3D Triangle)
    if (autoMorph) {
      morphHoldTimer++;
      if (morphHoldTimer > 240) { // Hold for ~4 seconds at 60fps
        targetMorph = targetMorph === 0 ? 1 : 0;
        morphHoldTimer = 0;
      }
    }

    // Approach target morph smoothly
    const morphSpeed = 0.015;
    if (morphProgress < targetMorph) {
      morphProgress = Math.min(targetMorph, morphProgress + morphSpeed);
    } else if (morphProgress > targetMorph) {
      morphProgress = Math.max(targetMorph, morphProgress - morphSpeed);
    }

    const easedMorph = easeInOutCubic(morphProgress);

    const cosY = Math.cos(angleY), sinY = Math.sin(angleY);
    const cosX = Math.cos(angleX), sinX = Math.sin(angleX);
    const cx = w / 2;
    const cy = h / 2;
    const baseRadius = Math.min(w, h) * 0.38;

    // Pulse effect
    let pulse = 1.0;
    if (currentMode === 'speaking') {
      pulse = 1.0 + Math.sin(frame * 0.18) * 0.045;
    } else if (currentMode === 'thinking') {
      pulse = 1.0 + Math.sin(frame * 0.06) * 0.025;
    } else if (currentMode === 'listening') {
      pulse = 1.0 + Math.sin(frame * 0.12) * 0.03;
    } else {
      pulse = 1.0 + Math.sin(frame * 0.035) * 0.012;
    }

    const currentRadius = baseRadius * pulse;

    // Sort dots by depth (Z-buffer) for clean rendering
    const projected = [];

    for (let i = 0; i < dots.length; i++) {
      const p = dots[i];

      // Interpolate between Sphere (sx, sy, sz) and Triangle (tx, ty, tz)
      const lx = p.sx * (1 - easedMorph) + p.tx * easedMorph;
      const ly = p.sy * (1 - easedMorph) + p.ty * easedMorph;
      const lz = p.sz * (1 - easedMorph) + p.tz * easedMorph;

      // 3D Rotation (Y axis then X axis)
      const x1 = lx * cosY - lz * sinY;
      const z1 = lx * sinY + lz * cosY;

      const y2 = ly * cosX - z1 * sinX;
      const z2 = ly * sinX + z1 * cosX;

      const perspective = 0.85 + (z2 + 1) * 0.16;
      const px = cx + x1 * currentRadius * perspective;
      const py = cy - y2 * currentRadius * perspective; // Invert Y for screen coordinates (Apex on top)

      projected.push({
        px: px,
        py: py,
        z: z2,
        yNorm: (y2 + 1.2) / 2.4, // Normalized vertical position for gradient
        size: p.size,
        tint: p.tint
      });
    }

    // Depth sort: back to front
    projected.sort((a, b) => a.z - b.z);

    for (let i = 0; i < projected.length; i++) {
      const pt = projected[i];
      const ny = Math.max(0, Math.min(1, pt.yNorm));

      // Aura Gradient:
      // Top (ny near 1): Emerald Green (34, 197, 94) -> (16, 185, 129)
      // Middle (ny near 0.5): Cyan / Turquoise (6, 182, 212)
      // Bottom (ny near 0): Vibrant Ocean Blue (37, 99, 235)
      let r, g, b;
      if (ny > 0.5) {
        const t = (ny - 0.5) * 2;
        r = Math.round(6 + (34 - 6) * t);
        g = Math.round(182 + (197 - 182) * t);
        b = Math.round(212 + (94 - 212) * t);
      } else {
        const t = ny * 2;
        r = Math.round(37 + (6 - 37) * t);
        g = Math.round(99 + (182 - 99) * t);
        b = Math.round(235 + (212 - 235) * t);
      }

      // Mode-specific accent highlights
      if (currentMode === 'thinking' && pt.tint > 0.6) {
        r = 168; g = 85; b = 247; // Violet accent
      } else if (currentMode === 'speaking' && pt.tint > 0.5) {
        r = 56; g = 189; b = 248; // Bright cyan glow
      }

      const alpha = 0.28 + (pt.z + 1) * 0.35;
      const dotRadius = Math.max(0.6, pt.size * (0.75 + (pt.z + 1) * 0.22));

      ctx.beginPath();
      ctx.fillStyle = `rgba(${r},${g},${b},${Math.min(1, alpha)})`;
      ctx.arc(pt.px, pt.py, dotRadius, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(draw);
  }

  // Touch drag rotation for interactive 3D particle sphere
  let isDragging = false;
  let lastTouchX = 0, lastTouchY = 0;
  let didDrag = false;

  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      isDragging = true;
      didDrag = false;
      lastTouchX = e.touches[0].clientX;
      lastTouchY = e.touches[0].clientY;
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    if (isDragging && e.touches.length === 1) {
      e.preventDefault();
      const tx = e.touches[0].clientX;
      const ty = e.touches[0].clientY;
      const dx = tx - lastTouchX;
      const dy = ty - lastTouchY;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
        didDrag = true;
      }
      angleY += dx * 0.008;
      angleX -= dy * 0.008;
      lastTouchX = tx;
      lastTouchY = ty;
    }
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    isDragging = false;
    if (!didDrag) {
      // Tap on orb
      if (window.AndroidBridge && window.AndroidBridge.onOrbTapped) {
        window.AndroidBridge.onOrbTapped();
      }
    }
  });

  canvas.addEventListener('touchcancel', () => {
    isDragging = false;
  });

  // Container click fallback for desktop/mouse
  container.addEventListener('click', () => {
    if (!didDrag && window.AndroidBridge && window.AndroidBridge.onOrbTapped) {
      window.AndroidBridge.onOrbTapped();
    }
  });

  // External control from Android WebView
  window.setAuraMode = function(mode) {
    currentMode = mode || 'idle';
  };

  window.setAuraShape = function(shape) { // 'sphere' or 'triangle'
    targetMorph = shape === 'triangle' ? 1 : 0;
    morphHoldTimer = 0;
  };

  window.addEventListener('resize', resize);
  resize();
  draw();
})();
</script>
</body>
</html>
